name: nurvnet-ai-bridge

services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v7.2.119
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLIPROXY_PORT:-8317}:8317"
      - "${BIND_ADDRESS:-127.0.0.1}:8085:8085"
      - "${BIND_ADDRESS:-127.0.0.1}:1455:1455"
      - "${BIND_ADDRESS:-127.0.0.1}:54545:54545"
      - "${BIND_ADDRESS:-127.0.0.1}:51121:51121"
      - "${BIND_ADDRESS:-127.0.0.1}:11451:11451"
    volumes:
      - ./config/cliproxyapi.yaml:/CLIProxyAPI/config.yaml
      - ./data/cliproxyapi/auths:/root/.cli-proxy-api
      - ./data/cliproxyapi/logs:/CLIProxyAPI/logs
      - ./data/cliproxyapi/static:/CLIProxyAPI/static
    environment:
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/static
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8317;
          printf "HEAD /healthz HTTP/1.0\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - bridge

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    restart: unless-stopped
    depends_on:
      cliproxyapi:
        condition: service_healthy
    env_file:
      - ./.runtime/open-webui.env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --silent --fail http://localhost:8080/health | jq -e '.status == true' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - bridge

networks:
  bridge:
    driver: bridge
