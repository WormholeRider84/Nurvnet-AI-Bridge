host: ""
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

# Docker reaches this endpoint from a bridge address, so remote management must
# be enabled here. Compose still publishes it to localhost only by default.
remote-management:
  allow-remote: true
  secret-key: "__CLIPROXY_MANAGEMENT_KEY__"
  disable-control-panel: false
  disable-auto-update-panel: true

auth-dir: "/root/.cli-proxy-api"

api-keys:
  - "__CLIPROXY_API_KEY__"

debug: false
logging-to-file: true
logs-max-total-size-mb: 100

# Providers are normally added in http://localhost:8317/management.html.
# Manual fallback for an OpenAI-compatible provider without model discovery:
